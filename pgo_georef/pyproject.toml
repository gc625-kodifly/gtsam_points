[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pgo-georef"
version = "0.1.0"
description = "CPU-only pose-graph georeferencing for pan/tilt LiDAR scans"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "laspy[laszip]>=2.0",
]

[project.scripts]
pgo-georef = "pgo_georef.cli:main"

[tool.setuptools]
packages = ["pgo_georef"]
package-dir = { pgo_georef = "." }
